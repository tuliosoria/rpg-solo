version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22.12.0 || nvm install 22.12.0
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Next.js static export output (next.config.ts: output: 'export')
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
