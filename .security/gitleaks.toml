title = "Reviewed default Gitleaks rules"
[extend]
useDefault = true
# No blanket allowlist or baseline. Review narrowly scoped exceptions explicitly.

# Owner @tuliosoria; reviewed 2026-11-09; review due 2027-02-07.
# Exact digest verified against the referenced asset bytes; not a credential.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed single asset inventory checksum"
condition = "AND"
paths = ['''(^|/)docs/asset-inventory\.csv$''']
regexTarget = "secret"
regexes = ['''^5d7e9e6dbac3937874b39d4e4c4e85340ed6db1a0695f22acf8bd1e8ddd714fb$''']
